# Static hosting for site/dist. No server-side code, no database, no cookies.
# short, privacy-friendly logs: no query strings, no referrers
log_format lean '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# Every script, style, picture and data file the pages ask for carries ?v= (a content or build
# version), so browsers may keep it for a year: the next build asks for new URLs. Anything asked for
# without ?v= (downloads, old links) gets a short cache instead.
map $arg_v $static_cache {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}
map $arg_v $data_cache {
    ""      "public, max-age=300";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/csv text/plain text/markdown application/xml application/manifest+json;

    access_log /var/log/nginx/access.log lean;

    error_page 404 /404.html;

    location = /healthz { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store"; default_type text/plain; }
    location /static/fonts/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /static/ { include /etc/nginx/security-headers.conf; add_header Cache-Control $static_cache; }
    location /data/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $data_cache;
        add_header Access-Control-Allow-Origin "*";
    }
    # pages are rechecked on every visit (a quick 304 when unchanged), so a deploy shows up at once
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
